name: Build waiter Android APK

# يبني APK تطبيق النادل عند أي تعديل داخل waiter-android، وينشره كإصدار على GitHub
on:
  push:
    branches: [main]
    paths:
      - 'waiter-android/**'
      - '.github/workflows/waiter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: waiter-android
        run: gradle :app:assembleDebug -PvCode=${{ github.run_number }} -PvName=1.0.${{ github.run_number }} --no-daemon
      - name: Rename APK
        run: cp waiter-android/app/build/outputs/apk/debug/app-debug.apk waiter-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: waiter-apk
          path: waiter-v1.0.${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: waiter-v1.0.${{ github.run_number }}
          name: تطبيق النادل 1.0.${{ github.run_number }}
          files: waiter-v1.0.${{ github.run_number }}.apk
